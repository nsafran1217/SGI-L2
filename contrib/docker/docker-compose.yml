# The SGI L2 in Docker (README.md): one container with l2, its console on
# telnet port 23, and with WEBGUI=1 the web l2gui on port 8080.
#
#   docker compose up -d                      # the image from ghcr.io
#   docker compose build                      # or the image from this checkout
#
# The settings are under environment: below. The container is on the host's network:
# discovery is a UDP broadcast, other L2s connect back, and SGI's L3 and IST
# tools reach l2 on its usual ports.

services:
  sgi-l2:
    # (a release's tag, such as :1.0.0, in place of :latest to stay on it)
    image: ghcr.io/nsafran1217/sgi-l2:latest
    build:
      context: ../..
      dockerfile: contrib/docker/Dockerfile
    container_name: sgi-l2
    network_mode: host
    # (quit on the console ends l2, and the container: it comes back)
    restart: always
    environment:
      # l2's options. Don't change. (-noconn: an L2 with no bricks; 
      # -usbpath 'b1;p2': only the L1s behind bus 1, port 2)
      L2_OPTIONS: "-discover"
      # L2 telnet port
      TELNET_PORT: "23"
      # "0": disable web l2gui, at http://<host>:8080/
      WEBGUI: "1"
      # What interface l2gui listens and what port.
      # to setup behind a reverse proxy, see README.md)
      WEBGUI_LISTEN: "0.0.0.0:8080"
    # the L1s on USB, plugged in now or later (USB devices are major 189;
    # hotplug events come from the kernel, on the host's network)
    device_cgroup_rules:
      - 'c 189:* rmw'
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - l2-state:/var/lib/sgi-l2

volumes:
  l2-state:
